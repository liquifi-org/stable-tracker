# HTTP → HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name stabletracker.org www.stabletracker.org;
    return 301 https://stabletracker.org$request_uri;
}

# HTTPS www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.stabletracker.org;

    ssl_certificate /etc/letsencrypt/live/stabletracker.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stabletracker.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://stabletracker.org$request_uri;
}

# HTTPS apex
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name stabletracker.org;

    root /var/www/stable-tracker;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    ssl_certificate /etc/letsencrypt/live/stabletracker.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stabletracker.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location /v1/ {
        proxy_pass http://127.0.0.1:3003/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-docs {
        proxy_pass http://127.0.0.1:3003/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.md$ {
        default_type text/markdown;
        charset utf-8;
        add_header Link '</llms.txt>; rel="describedby"' always;
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/markdown;
        charset utf-8;
        add_header Link '</llms.txt>; rel="describedby"' always;
    }

    location / {
        add_header Link '</llms.txt>; rel="describedby"' always;
        try_files $uri $uri/ /index.html;
    }
}
